
name: idontCONNECT Flutter Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - windows-flutter
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: flutter-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows bundle
        run: dart setup.dart windows --targets zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idontCONNECT-Windows-x64
          path: |
            flutter-app/build/**
            flutter-app/dist/**
          if-no-files-found: warn
          retention-days: 14
